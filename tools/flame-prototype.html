<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aura Sense · flame prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 12px ui-monospace, "JetBrains Mono", Consolas, monospace; color: #b9c4cc; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 0; left: 0; padding: 12px 14px; width: 260px;
    background: rgba(6,8,10,0.72); border-right: 1px solid #1d2429; border-bottom: 1px solid #1d2429;
    backdrop-filter: blur(3px); max-height: 100vh; overflow-y: auto;
  }
  #panel h1 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 10px; color: #6d7a83; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row label { flex: 1; color: #8b98a1; }
  .row input[type=range] { width: 110px; accent-color: #ff5fa8; }
  .row .val { width: 44px; text-align: right; color: #e7ecef; font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 4px; margin: 2px 0 12px; }
  .seg button {
    flex: 1; font: inherit; font-size: 10.5px; padding: 5px 0; cursor: pointer;
    background: #12171c; border: 1px solid #262e35; color: #8b98a1; border-radius: 2px;
  }
  .seg button.on { background: rgba(255,95,168,.16); border-color: #ff5fa8; color: #ffe4f1; }
  hr { border: 0; border-top: 1px solid #1d2429; margin: 12px 0; }
  #stats { color: #55616a; margin-top: 10px; line-height: 1.7; }
  #stats b { color: #9fb0ba; font-weight: 500; }
  .hint { color: #55616a; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h1>Aura Sense · flame prototype</h1>

  <div class="seg" id="states">
    <button data-burn="1">Base</button>
    <button data-burn="1.8">Shikai</button>
    <button data-burn="3.6">Bankai</button>
    <button data-burn="7.56" class="on">+Flex</button>
  </div>

  <div class="row"><label>burn</label><input id="burn" type="range" min="0.5" max="8" step="0.05" value="7.56"><span class="val" id="burnV">7.56</span></div>
  <div class="row"><label>radius (px)</label><input id="radius" type="range" min="2" max="120" step="1" value="46"><span class="val" id="radiusV">46</span></div>
  <hr>
  <div class="row"><label>rate /s per unit</label><input id="rate" type="range" min="10" max="900" step="5" value="620"><span class="val" id="rateV">620</span></div>
  <div class="row"><label>life (s)</label><input id="life" type="range" min="0.2" max="2.5" step="0.05" value="0.95"><span class="val" id="lifeV">0.95</span></div>
  <div class="row"><label>buoyancy</label><input id="buoy" type="range" min="0" max="20" step="0.1" value="13"><span class="val" id="buoyV">13</span></div>
  <div class="row"><label>turbulence</label><input id="turb" type="range" min="0" max="10" step="0.1" value="4.4"><span class="val" id="turbV">4.4</span></div>
  <div class="row"><label>swirl</label><input id="swirl" type="range" min="0" max="6" step="0.1" value="2.4"><span class="val" id="swirlV">2.4</span></div>
  <div class="row"><label>drag</label><input id="drag" type="range" min="0" max="4" step="0.05" value="0.45"><span class="val" id="dragV">0.45</span></div>
  <div class="row"><label>taper</label><input id="taper" type="range" min="0" max="4" step="0.05" value="0.95"><span class="val" id="taperV">0.95</span></div>
  <div class="row"><label>grow</label><input id="grow" type="range" min="0" max="3" step="0.05" value="0.7"><span class="val" id="growV">0.7</span></div>
  <div class="row"><label>spawn disc</label><input id="disc" type="range" min="0" max="2.5" step="0.02" value="1.1"><span class="val" id="discV">1.1</span></div>
  <div class="row"><label>dome</label><input id="dome" type="range" min="0" max="1" step="0.02" value="0.8"><span class="val" id="domeV">0.80</span></div>
  <div class="row"><label>bloom</label><input id="bloom" type="range" min="0" max="3" step="0.05" value="0.6"><span class="val" id="bloomV">0.60</span></div>
  <div class="row"><label>opacity</label><input id="opacity" type="range" min="0.05" max="1.5" step="0.01" value="0.3"><span class="val" id="opacityV">0.30</span></div>
  <div class="row"><label>grain</label><input id="grain" type="range" min="0.04" max="0.6" step="0.01" value="0.26"><span class="val" id="grainV">0.26</span></div>
  <div class="row"><label>stretch</label><input id="stretch" type="range" min="0" max="3" step="0.05" value="1.75"><span class="val" id="stretchV">1.75</span></div>
  <div class="row"><label>gust</label><input id="gust" type="range" min="0" max="1.5" step="0.05" value="0.65"><span class="val" id="gustV">0.65</span></div>
  <div class="row"><label>churn</label><input id="churn" type="range" min="0.2" max="4" step="0.05" value="1.9"><span class="val" id="churnV">1.9</span></div>
  <hr>
  <div class="row"><label>spin</label><input id="spin" type="range" min="0" max="1.5" step="0.05" value="0.35"><span class="val" id="spinV">0.35</span></div>
  <div class="row"><label>haze</label><input id="haze" type="range" min="0" max="0.5" step="0.01" value="0.12"><span class="val" id="hazeV">0.12</span></div>

  <div id="stats"></div>
  <div class="hint">Drag to orbit. The four small fires on the right are the same system at distant-soul radii — 3, 6, 12, 22 px.</div>
</div>

<script>
"use strict";

// =====================================================================================
// Aura Sense flame · prototype
//
// The point of this file is to settle the LOOK before any of it is written in Java, and to
// keep the technique inside what the mod's HUD overlay can actually do: additive blobs with
// a colour that changes over each blob's life, and nothing else. No shaders, no textures
// beyond one radial gradient, no depth sorting.
//
// The idea the static-geometry version got wrong: fire is not a shape, it is a POPULATION.
// Particles are born hot and white at the base, rise, cool through the aura's colour, spread,
// and die. Every recognisable feature of a flame — the taper, the flicker, the wisps coming
// off the tip — falls out of that, and none of it has to be drawn on purpose.
//
// It is 3D so the fire has volume when the camera moves: particles live in a local space with
// y up, and are rotated and perspective-divided per frame. Additive blending means depth
// sorting is unnecessary, which is most of why this is cheap.
// =====================================================================================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

// --- Controls -------------------------------------------------------------------------

const P = {};
const sliders = ["burn","radius","rate","life","buoy","turb","swirl","drag","taper","grow","disc","dome","bloom","opacity","grain","stretch","gust","churn","spin","haze"];
for (const id of sliders) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + "V");
  P[id] = parseFloat(el.value);
  el.addEventListener("input", () => { P[id] = parseFloat(el.value); out.textContent = el.value; });
}

document.querySelectorAll("#states button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#states button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const v = b.dataset.burn;
    document.getElementById("burn").value = v;
    document.getElementById("burnV").textContent = v;
    P.burn = parseFloat(v);
  });
});

// --- The sprite -----------------------------------------------------------------------
//
// One radial gradient, pre-rendered once per step of the colour ramp. Canvas 2D cannot tint an
// image cheaply, so instead of one white sprite tinted per particle there are N sprites, one
// per band of the ramp, and a particle picks the band its age falls in. This is the whole of
// the "cheap" claim: per particle, per frame, the work is one drawImage.
//
// In the Java port the equivalent is: keep the one blob-drawing routine, and give it the
// ramped colour per particle. There is no texture to build at all.

const RAMP_STEPS = 24;
const SPRITE_PX = 64;

function mix(a, b, t) {
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
}

/**
 * Colour of a particle at age t (0 born .. 1 dead).
 *
 * White-hot at the base, through the aura's own colour, into a deep cooled version of it. This
 * ramp is doing most of the visual work: a flame drawn in ONE colour reads as a glowing blob no
 * matter how good the motion is, because real fire is a temperature gradient before it is a shape.
 */
function rampColor(base, t) {
  const white = [255, 255, 255];
  const hot   = mix(base, white, 0.72);
  const cool  = [base[0]*0.42, base[1]*0.16, base[2]*0.62];  // cools toward the blue end
  // The white phase is deliberately SHORT. Additive blending stacks it, so a wide white band
  // saturates the middle of the fire into a featureless white blob — which is exactly what the
  // first pass of this file did. Held brief, it reads as a hot core instead.
  if (t < 0.05) return mix(white, hot, t / 0.05);
  if (t < 0.22) return mix(hot, base, (t - 0.05) / 0.17);
  return mix(base, cool, (t - 0.22) / 0.78);
}

function buildSprites(base) {
  const out = [];
  for (let i = 0; i < RAMP_STEPS; i++) {
    const t = i / (RAMP_STEPS - 1);
    const [r, g, b] = rampColor(base, t).map(v => Math.round(Math.max(0, Math.min(255, v))));

    const s = document.createElement("canvas");
    s.width = s.height = SPRITE_PX;
    const sc = s.getContext("2d");
    const half = SPRITE_PX / 2;

    // A hot core with a long soft skirt. The extra stops are what stop it looking like a
    // billiard ball — a plain two-stop gradient has a visible hard shoulder when stacked.
    const g2 = sc.createRadialGradient(half, half, 0, half, half, half);
    g2.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
    g2.addColorStop(0.18, `rgba(${r},${g},${b},0.72)`);
    g2.addColorStop(0.42, `rgba(${r},${g},${b},0.28)`);
    g2.addColorStop(0.70, `rgba(${r},${g},${b},0.07)`);
    g2.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    sc.fillStyle = g2;
    sc.fillRect(0, 0, SPRITE_PX, SPRITE_PX);
    out.push(s);
  }
  return out;
}

// --- Noise ----------------------------------------------------------------------------
//
// Deliberately the cheapest thing that still looks like turbulence: three sine waves at
// unrelated frequencies. A real value-noise lookup is barely more expensive here, but sines
// port to Java as-is with no table, and at flame scale nobody can tell them apart.

// `churn` multiplies only the TIME terms, so raising it makes the same field boil faster without
// changing the size of the structures in it. That separation matters: speeding the field up by
// shortening its wavelength instead would just make the fire finer-grained, not more violent.

function turbX(x, y, z, t) {
  const c = t * P.churn;
  return Math.sin(y * 0.055 + c * 1.7) * Math.cos(z * 0.041 - c * 1.1)
       + Math.sin(x * 0.083 - c * 2.3) * 0.5
       + Math.sin(y * 0.017 + c * 0.6) * 0.8;   // a long wavelength that leans whole sheets over
}
function turbZ(x, y, z, t) {
  const c = t * P.churn;
  return Math.cos(y * 0.061 - c * 1.4) * Math.sin(x * 0.037 + c * 1.3)
       + Math.cos(z * 0.079 + c * 2.1) * 0.5
       + Math.cos(y * 0.019 - c * 0.7) * 0.8;
}

/**
 * Gusting. A fire that burns at a constant rate reads as a machine — the thing that makes real
 * fire look violent is that it surges: it flares, falls back, and flares again. Two sine waves at
 * unrelated periods give a pulse that never repeats visibly, and each fire carries its own phase
 * so two souls side by side never surge together.
 */
function gustAt(time, seed) {
  const g = Math.sin(time * 2.3 + seed) * 0.6 + Math.sin(time * 3.9 + seed * 1.7) * 0.4;
  return 1 + P.gust * g;
}

// --- The fire -------------------------------------------------------------------------

class Fire {
  /**
   * @param {number[]} base   aura colour, 0..255
   * @param {number}   scale  drawn radius in px — the mod's projected aura radius
   * @param {number[]} anchor screen position
   */
  constructor(base, anchor) {
    this.sprites = buildSprites(base);
    this.base = base;
    this.anchor = anchor;
    this.particles = [];
    this.spawnDebt = 0;
    this.seed = Math.random() * 1000;
  }

  /**
   * Particles are stored in a flat pool and compacted in place rather than spliced, because a
   * splice per death is the one thing in here that would actually cost something.
   */
  update(dt, radius, burn, time) {
    const ps = this.particles;

    // The surge, shared by everything in this fire for this frame: it spawns harder, throws
    // harder and shakes harder all at once, which is what makes a flare read as one event rather
    // than three unrelated ones.
    const gust = gustAt(time, this.seed);

    // Spawn. Rate scales with burn AND with the drawn radius, which is what stops a distant
    // soul being a single lonely blob — it is a small fire, not a dot.
    const rate = P.rate * (0.35 + burn * 0.14) * (0.35 + Math.min(radius, 90) / 90)
               * Math.max(0.25, gust);
    this.spawnDebt += rate * dt;
    const born = Math.floor(this.spawnDebt);
    this.spawnDebt -= born;

    for (let i = 0; i < born && ps.length < 9000; i++) {
      // Spawn through a volume, not off a point or a flat disc. `dome` lifts the footprint into a
      // squashed half-sphere sitting on the soul, so the fire wraps around it and reads round from
      // any angle instead of being a column standing on a plate — which is what a flat disc gives
      // you the moment the camera is level with it.
      const a = Math.random() * Math.PI * 2;
      const rr = Math.cbrt(Math.random());                // filled, not shelled — no hollow centre
      const elev = Math.random() * Math.PI * 0.5 * P.dome;
      const ce = Math.cos(elev), se = Math.sin(elev);

      const R = radius * P.disc;
      const x = Math.cos(a) * ce * rr * R;
      const z = Math.sin(a) * ce * rr * R;
      const y = se * rr * R * 0.75;                       // squashed: wider than it is tall

      ps.push({
        x: x,
        y: y + (Math.random() - 0.5) * radius * 0.08,
        z: z,
        // Velocity is radial off the dome plus lift, so the base rolls outward before it climbs.
        // `bloom` against `buoy` is the whole shape control: bloom wins and it is a ball of fire,
        // buoy wins and it is a jet.
        vx: Math.cos(a) * ce * radius * P.bloom * (0.4 + Math.random()),
        vy: (se * radius * P.bloom * 0.6
             + radius * (0.35 + Math.random() * 1.6)) * Math.max(0.3, gust),
        vz: Math.sin(a) * ce * radius * P.bloom * (0.4 + Math.random()),
        age: 0,
        life: P.life * (0.55 + Math.random() * 0.9),
        // Small and many, never big and few. Additive light builds a gradient out of overlap;
        // a handful of fat sprites just clips to white wherever two of them cross.
        size: radius * P.grain * (0.6 + Math.random() * 0.9),
        spin: (Math.random() - 0.5) * 2,
      });
    }

    let n = 0;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.age += dt;
      if (p.age >= p.life) continue;

      const t = p.age / p.life;

      // Buoyancy — hot gas rises, and it rises harder while it is still hot. Fading it out with
      // age is what makes the top of the fire stall and break up instead of shooting off screen.
      p.vy += radius * P.buoy * (1 - t * 0.7) * dt;

      // Turbulence, scaled by radius so a small fire is not violently shaken, and ramped with age
      // so the base stays coherent and only the top breaks up. Applied flat, it out-competes
      // buoyancy immediately and the whole fire lies down into a crown.
      const tf = radius * P.turb * dt * (0.18 + t * 1.4) * Math.max(0.4, gust);
      p.vx += turbX(p.x, p.y, p.z, time + this.seed) * tf;
      p.vz += turbZ(p.x, p.y, p.z, time + this.seed) * tf;

      // Swirl about the axis. Real fire entrains air and rotates; without this the turbulence
      // reads as random jitter rather than as motion.
      const sw = radius * P.swirl * dt * p.spin;
      p.vx += -p.z * sw * 0.05;
      p.vz += p.x * sw * 0.05;

      // Taper — pull toward the axis, growing with age. This is what gives a flame its point.
      // Without it buoyancy plus turbulence makes a smoke column, which widens forever.
      const pull = P.taper * dt * t;
      p.vx -= p.x * pull;
      p.vz -= p.z * pull;

      const d = Math.max(0, 1 - P.drag * dt);
      p.vx *= d; p.vy *= d; p.vz *= d;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;

      ps[n++] = p;
    }
    ps.length = n;
  }

  /** One drawImage per particle, additively, at the projected position and size. */
  draw(cam, radius) {
    const ps = this.particles;
    const [ax, ay] = this.anchor;

    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      const t = p.age / p.life;

      // Rotate about y, then perspective-divide. Depth only ever changes the size and never the
      // order, because additive blending has no order.
      const rx = p.x * cam.cos - p.z * cam.sin;
      const rz = p.x * cam.sin + p.z * cam.cos;
      const depth = cam.dist - rz;
      if (depth < 20) continue;
      const proj = cam.focal / depth;

      const sx = ax + rx * proj;
      const sy = ay - p.y * proj;

      // Grow as it rises and cools — expanding gas — then shrink into nothing at the very end so
      // particles do not blink out at full size.
      const size = p.size * (1 + t * P.grow) * (1 - t * t * 0.35) * proj;
      if (size < 0.4) continue;

      // Alpha: swells in, long fall off. The square is what keeps the tips wispy. Kept low on
      // purpose — the brightness of the fire comes from how many particles overlap, not from how
      // solid each one is, and that is the only way the core stays a gradient instead of clipping
      // to a white pill.
      const alpha = Math.min(1, t * 5) * (1 - t) * (1 - t) * P.opacity;
      if (alpha <= 0.01) continue;

      const step = Math.min(RAMP_STEPS - 1, (t * RAMP_STEPS) | 0);
      ctx.globalAlpha = alpha;

      // Stretch along the direction of travel. This is the single thing that turns a column of
      // round dots into fire: a fast particle is a streak, a slow one at the top is a puff, and
      // the streaks all leaning along their own velocity is what reads as flame licking upward.
      // Area is held roughly constant (widen by s, thin by 1/√s) so stretching does not also
      // brighten.
      const vsx = (p.vx * cam.cos - p.vz * cam.sin) * proj;
      const vsy = -p.vy * proj;
      const speed = Math.hypot(vsx, vsy) / (radius * proj + 0.001);
      const s = 1 + P.stretch * Math.min(2.2, speed * 0.42);

      if (s > 1.03) {
        const inv = 1 / Math.sqrt(s);
        const ang = Math.atan2(vsy, vsx);
        const ca = Math.cos(ang), sa = Math.sin(ang);
        ctx.setTransform(DPR * ca * s, DPR * sa * s, DPR * -sa * inv, DPR * ca * inv,
                         DPR * sx, DPR * sy);
        ctx.drawImage(this.sprites[step], -size, -size, size * 2, size * 2);
      } else {
        // Reset first — a stretched particle earlier in the loop left its transform in place.
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.drawImage(this.sprites[step], sx - size, sy - size, size * 2, size * 2);
      }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
  }

  /** The wash of light a fire throws on the dark around it. One gradient, drawn once. */
  drawHaze(radius) {
    if (P.haze <= 0) return;
    const [ax, ay] = this.anchor;
    const R = radius * 5.5;
    const g = ctx.createRadialGradient(ax, ay - radius * 0.6, 0, ax, ay - radius * 0.6, R);
    const [r, gg, b] = this.base;
    g.addColorStop(0, `rgba(${r|0},${gg|0},${b|0},${P.haze})`);
    g.addColorStop(1, `rgba(${r|0},${gg|0},${b|0},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(ax - R, ay - radius * 0.6 - R, R * 2, R * 2);
  }
}

// --- Scene ----------------------------------------------------------------------------

resize();

const MAGENTA = [236, 64, 190];
const CYAN    = [138, 230, 255];
const AMBER   = [224, 162, 69];
const VIOLET  = [185, 140, 240];
const GREEN   = [124, 219, 138];

// The main subject, plus four distant-soul sizes to prove the same system does not degenerate
// into a dot when the radius drops — the exact failure the geometry version had.
let main, minors;
function layout() {
  main = new Fire(MAGENTA, [W * 0.5, H * 0.72]);
  minors = [
    { fire: new Fire(CYAN,   [W * 0.80, H * 0.55]), r: 22 },
    { fire: new Fire(AMBER,  [W * 0.87, H * 0.62]), r: 12 },
    { fire: new Fire(VIOLET, [W * 0.92, H * 0.68]), r: 6  },
    { fire: new Fire(GREEN,  [W * 0.96, H * 0.73]), r: 3  },
  ];
}
layout();
window.addEventListener("resize", () => { resize(); layout(); });

// --- Camera ---------------------------------------------------------------------------

let yaw = 0, dragging = false, lastX = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup",   e => { dragging = false; });
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw += (e.clientX - lastX) * 0.01;
  lastX = e.clientX;
});

// --- Loop -----------------------------------------------------------------------------

let last = performance.now();
let fpsSmooth = 60;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);              // a tab-out must not teleport the whole fire
  const time = now / 1000;

  if (!dragging) yaw += P.spin * dt;

  const cam = {
    cos: Math.cos(yaw), sin: Math.sin(yaw),
    dist: 900, focal: 900,
  };

  // Clear opaque — the mod draws this over a blackout, so black is the honest background.
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";

  main.update(dt, P.radius, P.burn, time);
  main.drawHaze(P.radius);
  main.draw(cam, P.radius);

  let total = main.particles.length;
  for (const m of minors) {
    m.fire.update(dt, m.r, P.burn, time);
    m.fire.draw(cam, m.r);
    total += m.fire.particles.length;
  }

  fpsSmooth += (1 / Math.max(dt, 1e-4) - fpsSmooth) * 0.05;
  document.getElementById("stats").innerHTML =
    `<b>${total}</b> particles · <b>${fpsSmooth.toFixed(0)}</b> fps<br>` +
    `<b>${(total / Math.max(1, W*H/1e6)).toFixed(0)}</b> per Mpx · one drawImage each`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
